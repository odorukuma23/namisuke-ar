<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>なみすけAR - 杉並区キャラクター</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    /* ── ローディング画面 ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d1a2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4aaef0, #7c4dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(74, 174, 240, 0.4);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(74,174,240,0.4); }
      50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(74,174,240,0.7); }
    }

    #loading-screen h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #4aaef0, #b39dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #loading-screen p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 30px;
    }

    .start-btn {
      background: linear-gradient(135deg, #4aaef0, #7c4dff);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(74,174,240,0.4);
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(74,174,240,0.5); }
    .start-btn:active { transform: scale(0.97); }

    .tips {
      margin-top: 30px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      max-width: 320px;
      text-align: left;
    }
    .tips h3 { font-size: 12px; color: #4aaef0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
    .tips li { font-size: 12px; color: rgba(255,255,255,0.65); line-height: 1.7; margin-left: 14px; }

    /* ── AR シーン ── */
    #ar-scene-wrapper {
      display: none;
      position: fixed;
      inset: 0;
    }
    #ar-scene-wrapper.active { display: block; }

    a-scene {
      width: 100vw !important;
      height: 100vh !important;
    }

    /* ── UI オーバーレイ ── */
    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    /* ヘッダー */
    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header .badge {
      background: rgba(74,174,240,0.25);
      border: 1px solid rgba(74,174,240,0.5);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: #4aaef0;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    #header .title { font-size: 15px; font-weight: 600; }

    /* スキャンガイド */
    #scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #scan-guide.hidden { opacity: 0; }

    .corner {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: rgba(74,174,240,0.9);
      border-style: solid;
    }
    .corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    .scan-line {
      position: absolute;
      left: 10px; right: 10px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4aaef0, transparent);
      animation: scanAnim 2s linear infinite;
      border-radius: 1px;
    }
    @keyframes scanAnim {
      0% { top: 10px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 200px; opacity: 0; }
    }

    .scan-label {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      text-align: center;
    }

    /* 検出インジケーター */
    #detection-indicator {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,200,100,0.25);
      border: 1px solid rgba(0,200,100,0.6);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: #00c864;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #detection-indicator.visible { opacity: 1; }
    .dot-green {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00c864;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* アクションボタン */
    #action-buttons {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      pointer-events: all;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #action-buttons.visible { opacity: 1; }

    .action-btn {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.primary {
      background: linear-gradient(135deg, rgba(74,174,240,0.6), rgba(124,77,255,0.6));
      border-color: rgba(74,174,240,0.5);
    }

    /* マーカー表示パネル */
    #marker-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 9990;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.3s;
    }
    #marker-panel.hidden { opacity: 0; pointer-events: none; }

    .marker-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      max-width: 280px;
    }
    .marker-card img { width: 180px; height: 180px; display: block; margin: 0 auto 12px; }
    .marker-card p { color: #333; font-size: 12px; line-height: 1.6; }

    .panel-close {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 10px 30px;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    /* なみすけ感知テキスト */
    #found-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(74,174,240,0.9), rgba(124,77,255,0.9));
      border-radius: 16px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #found-toast.show {
      opacity: 1;
      animation: toastAnim 2s forwards;
    }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translate(-50%, -40%); }
      20% { opacity: 1; transform: translate(-50%, -50%); }
      70% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -60%); }
    }
  </style>
</head>
<body>

<!-- ────────────────────────────────────────────
  ローディング / スタート画面
──────────────────────────────────────────── -->
<div id="loading-screen">
  <div class="logo-circle">🌊</div>
  <h1>なみすけAR</h1>
  <p>杉並区キャラクター AR体験アプリ</p>
  <button class="start-btn" id="start-btn">カメラを起動する</button>

  <div class="tips">
    <h3>使い方</h3>
    <ul>
      <li>「マーカーを見る」ボタンでマーカーを表示</li>
      <li>マーカーを印刷またはスクリーンに表示</li>
      <li>カメラでマーカーに向ける</li>
      <li>なみすけが登場します！</li>
    </ul>
  </div>

  <button class="start-btn" style="margin-top:12px; background: rgba(255,255,255,0.1); box-shadow:none; border: 1px solid rgba(255,255,255,0.2);"
    id="show-marker-btn">マーカーを見る</button>
</div>

<!-- ────────────────────────────────────────────
  マーカー表示パネル
──────────────────────────────────────────── -->
<div id="marker-panel" class="hidden">
  <div class="marker-card">
    <!-- AR.js 標準 Hiro マーカーをインラインSVGで生成 -->
    <svg id="hiro-marker" width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
      <!-- 外枠（白） -->
      <rect width="180" height="180" fill="white"/>
      <!-- 黒い外枠 -->
      <rect x="8" y="8" width="164" height="164" fill="black"/>
      <!-- 白い内枠 -->
      <rect x="20" y="20" width="140" height="140" fill="white"/>
      <!-- Hiro マーカーパターン（中央の黒いパターン） -->
      <rect x="30" y="30" width="120" height="120" fill="black"/>
      <!-- Hiroパターン - 白い部分 -->
      <rect x="40" y="40" width="20" height="20" fill="white"/>
      <rect x="80" y="40" width="20" height="20" fill="white"/>
      <rect x="120" y="40" width="20" height="20" fill="white"/>
      <rect x="40" y="60" width="20" height="60" fill="white"/>
      <rect x="80" y="60" width="20" height="20" fill="white"/>
      <rect x="120" y="60" width="20" height="60" fill="white"/>
      <rect x="60" y="80" width="60" height="20" fill="white"/>
      <rect x="80" y="100" width="20" height="20" fill="white"/>
      <rect x="40" y="120" width="20" height="20" fill="white"/>
      <rect x="80" y="120" width="20" height="20" fill="white"/>
      <rect x="120" y="120" width="20" height="20" fill="white"/>
    </svg>
    <p>このマーカーをカメラに<br>向けるとなみすけが現れます</p>
    <p style="margin-top:6px; color:#888; font-size:11px;">印刷するかこの画面をそのまま使えます</p>
  </div>
  <button class="panel-close" id="marker-close-btn">閉じる</button>
</div>

<!-- ────────────────────────────────────────────
  AR シーン
──────────────────────────────────────────── -->
<div id="ar-scene-wrapper">
  <a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    loading-screen="enabled: false"
  >

    <!-- なみすけキャラクター（ビルボードスプライト） -->
    <!-- Hiroマーカーを検出したときに表示 -->
    <a-marker preset="hiro" id="hiro-marker-entity" smooth="true" smoothCount="5">

      <!-- 影 -->
      <a-circle
        position="0 0.02 0"
        rotation="-90 0 0"
        radius="0.7"
        color="#000000"
        opacity="0.25"
      ></a-circle>

      <!-- なみすけ本体（ビルボード表示） -->
      <!-- なみすけの公式キャラクターカラー: 青系 -->
      <a-entity
        id="namisuke-root"
        position="0 0.8 0"
        animation="property: position; to: 0 1.1 0; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine"
      >
        <!-- ── なみすけをSVGデータURIで描画 ── -->
        <a-image
          id="namisuke-sprite"
          src="#namisuke-img"
          width="1.4"
          height="1.4"
          look-at="[camera]"
          animation__spin="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear; startEvents: spin"
        ></a-image>

        <!-- グロウエフェクト（輝くリング） -->
        <a-torus
          position="0 -0.7 0"
          rotation="-90 0 0"
          radius="0.55"
          radius-tubular="0.03"
          color="#4aaef0"
          opacity="0.6"
          animation="property: rotation; from: -90 0 0; to: -90 360 0; dur: 3000; loop: true; easing: linear"
        ></a-torus>

        <!-- 星パーティクル -->
        <a-sphere position="0.7 0.3 0" radius="0.06" color="#FFD700"
          animation="property: position; to: 0.9 0.6 0; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine">
        </a-sphere>
        <a-sphere position="-0.6 0.1 0" radius="0.05" color="#FF6B9D"
          animation="property: position; to: -0.8 0.4 0; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine">
        </a-sphere>
        <a-sphere position="0.2 0.8 0" radius="0.04" color="#7C4DFF"
          animation="property: position; to: 0.4 1.1 0; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine">
        </a-sphere>
      </a-entity>

      <!-- 名前バッジ -->
      <a-text
        value="なみすけ"
        position="0 -0.15 0"
        align="center"
        color="#4aaef0"
        width="3"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
      ></a-text>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

    <!-- アセット -->
    <a-assets>
      <!-- なみすけのSVGをデータURIとして埋め込み -->
      <img id="namisuke-img" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20200%20200'%3E%3Ccircle%20cx%3D'100'%20cy%3D'100'%20r%3D'95'%20fill%3D'%2387CEEB'%20stroke%3D'%23fff'%20stroke-width%3D'4'%2F%3E%3Ccircle%20cx%3D'100'%20cy%3D'82'%20r%3D'52'%20fill%3D'%235ab4d6'%2F%3E%3Cellipse%20cx%3D'100'%20cy%3D'155'%20rx%3D'48'%20ry%3D'38'%20fill%3D'%235ab4d6'%2F%3E%3Ccircle%20cx%3D'82'%20cy%3D'76'%20r%3D'14'%20fill%3D'white'%2F%3E%3Ccircle%20cx%3D'118'%20cy%3D'76'%20r%3D'14'%20fill%3D'white'%2F%3E%3Ccircle%20cx%3D'85'%20cy%3D'78'%20r%3D'8'%20fill%3D'%23333'%2F%3E%3Ccircle%20cx%3D'121'%20cy%3D'78'%20r%3D'8'%20fill%3D'%23333'%2F%3E%3Ccircle%20cx%3D'88'%20cy%3D'76'%20r%3D'3'%20fill%3D'white'%2F%3E%3Ccircle%20cx%3D'124'%20cy%3D'76'%20r%3D'3'%20fill%3D'white'%2F%3E%3Cpath%20d%3D'M88%2096%20Q100%20108%20112%2096'%20stroke%3D'%23333'%20stroke-width%3D'3'%20fill%3D'none'%20stroke-linecap%3D'round'%2F%3E%3Cellipse%20cx%3D'76'%20cy%3D'84'%20rx%3D'12'%20ry%3D'8'%20fill%3D'%23FFB6C1'%20opacity%3D'0.7'%2F%3E%3Cellipse%20cx%3D'124'%20cy%3D'84'%20rx%3D'12'%20ry%3D'8'%20fill%3D'%23FFB6C1'%20opacity%3D'0.7'%2F%3E%3Cpath%20d%3D'M56%20140%20Q30%20130%2040%20150%20Q50%20170%2068%20160%20Z'%20fill%3D'%235ab4d6'%2F%3E%3Cpath%20d%3D'M144%20140%20Q170%20130%20160%20150%20Q150%20170%20132%20160%20Z'%20fill%3D'%235ab4d6'%2F%3E%3Ctext%20x%3D'100'%20y%3D'196'%20text-anchor%3D'middle'%20font-size%3D'13'%20fill%3D'%23fff'%20font-family%3D'sans-serif'%20font-weight%3D'bold'%3E%E3%81%AA%E3%81%BF%E3%81%99%E3%81%91%3C%2Ftext%3E%3C%2Fsvg%3E">
    </a-assets>

  </a-scene>
</div>

<!-- ────────────────────────────────────────────
  UI オーバーレイ（AR起動後に表示）
──────────────────────────────────────────── -->
<div id="ui-overlay" style="display:none;">

  <div id="header">
    <span class="badge">AR LIVE</span>
    <span class="title">なみすけAR</span>
  </div>

  <!-- マーカー検出インジケーター -->
  <div id="detection-indicator">
    <div class="dot-green"></div>
    なみすけを検出中！
  </div>

  <!-- スキャンガイド -->
  <div id="scan-guide">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line"></div>
    <div class="scan-label">マーカーをここに合わせてください</div>
  </div>

  <!-- 召喚トースト -->
  <div id="found-toast">🌊 なみすけが現れた！</div>

  <!-- アクションボタン -->
  <div id="action-buttons">
    <button class="action-btn" id="btn-dance">💃 ダンス</button>
    <button class="action-btn primary" id="btn-marker">マーカー表示</button>
    <button class="action-btn" id="btn-spin">🌀 回転</button>
  </div>

</div>

<!-- ────────────────────────────────────────────
  JavaScript
──────────────────────────────────────────── -->
<script>
(function() {
  /* ── 要素取得 ── */
  const loadingScreen   = document.getElementById('loading-screen');
  const arWrapper       = document.getElementById('ar-scene-wrapper');
  const uiOverlay       = document.getElementById('ui-overlay');
  const startBtn        = document.getElementById('start-btn');
  const showMarkerBtn   = document.getElementById('show-marker-btn');
  const markerPanel     = document.getElementById('marker-panel');
  const markerCloseBtn  = document.getElementById('marker-close-btn');
  const scanGuide       = document.getElementById('scan-guide');
  const detectionInd    = document.getElementById('detection-indicator');
  const actionBtns      = document.getElementById('action-buttons');
  const foundToast      = document.getElementById('found-toast');
  const hiroMarker      = document.getElementById('hiro-marker-entity');
  const namisukeSprite  = document.getElementById('namisuke-sprite');

  let isDetected = false;
  let detectionTimeout = null;

  /* ── マーカー表示 ── */
  showMarkerBtn.addEventListener('click', () => {
    markerPanel.classList.remove('hidden');
  });
  markerCloseBtn.addEventListener('click', () => {
    markerPanel.classList.add('hidden');
  });

  /* ── AR 起動 ── */
  startBtn.addEventListener('click', async () => {
    // カメラ権限リクエスト
    try {
      await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch(e) {
      alert('カメラへのアクセスが必要です。\nブラウザの設定からカメラを許可してください。');
      return;
    }

    // 画面切り替え
    loadingScreen.classList.add('hidden');
    arWrapper.classList.add('active');
    uiOverlay.style.display = 'block';

    setTimeout(() => loadingScreen.style.display = 'none', 700);

    // マーカー検出イベント
    hiroMarker.addEventListener('markerFound', onMarkerFound);
    hiroMarker.addEventListener('markerLost',  onMarkerLost);
  });

  /* ── マーカー検出 ── */
  function onMarkerFound() {
    if (isDetected) return;
    isDetected = true;
    clearTimeout(detectionTimeout);

    scanGuide.classList.add('hidden');
    detectionInd.classList.add('visible');
    actionBtns.classList.add('visible');

    // トースト表示
    foundToast.classList.remove('show');
    void foundToast.offsetWidth; // reflow
    foundToast.classList.add('show');
    setTimeout(() => foundToast.classList.remove('show'), 2200);
  }

  function onMarkerLost() {
    clearTimeout(detectionTimeout);
    detectionTimeout = setTimeout(() => {
      isDetected = false;
      scanGuide.classList.remove('hidden');
      detectionInd.classList.remove('visible');
      actionBtns.classList.remove('visible');
    }, 1500); // 1.5秒後にロスト判定（ちらつき防止）
  }

  /* ── アクションボタン ── */
  // 💃 ダンス: ジャンプアニメ強化
  document.getElementById('btn-dance').addEventListener('click', () => {
    const root = document.getElementById('namisuke-root');
    if (!root) return;
    root.setAttribute('animation', 'property: rotation; to: 0 720 0; dur: 1000; easing: easeInOutQuad');
    setTimeout(() => {
      root.setAttribute('animation', 'property: position; to: 0 1.1 0; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine');
    }, 1100);
  });

  // 🌀 回転
  document.getElementById('btn-spin').addEventListener('click', () => {
    const sprite = document.getElementById('namisuke-sprite');
    if (!sprite) return;
    sprite.emit('spin');
  });

  // マーカー表示（AR中から）
  document.getElementById('btn-marker').addEventListener('click', () => {
    markerPanel.classList.remove('hidden');
  });

})();
</script>

</body>
</html>
